name: Create Version Bump PR

# Manual trigger only
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to version (others stay pending)'
        type: choice
        default: all
        options:
          - all
          - '@optimizely/cms-create-app'
          - '@optimizely/cms-sdk'
          - '@optimizely/cms-cli'
      pre_mode:
        description: 'Pre-release: enter beta, exit back to stable, or leave as-is'
        type: choice
        default: none
        options:
          - none
          - enter
          - exit

jobs:
  version:
    name: Create Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install

      # `changeset version` reads .changeset/pre.json, so entering or exiting has
      # to happen before it runs. changesets/action commits the whole working-tree
      # diff to the version PR branch, so the pre.json change rides along with the
      # bump — exiting and versioning are one dispatch, not two.
      - name: Enter Pre-release Mode
        if: inputs.pre_mode == 'enter'
        run: pnpm changeset pre enter beta

      # Leaves "mode": "exit" behind; `changeset version` then deletes pre.json
      # and writes stable versions.
      - name: Exit Pre-release Mode
        if: inputs.pre_mode == 'exit'
        run: pnpm changeset pre exit

      - name: Create Version PR
        uses: changesets/action@v1
        with:
          version: bash scripts/version-selective.sh "${{ inputs.package }}"
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
