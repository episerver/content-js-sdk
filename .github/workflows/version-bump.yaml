name: Create Version Bump PR

# Manual trigger only
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to version (others stay pending)'
        type: choice
        default: all
        options:
          - all
          - '@optimizely/cms-create-app'
          - '@optimizely/cms-sdk'
          - '@optimizely/cms-cli'
      pre_mode:
        description: 'Pre-release: enter beta, exit back to stable, or leave as-is'
        type: choice
        default: none
        options:
          - none
          - enter
          - exit

jobs:
  version:
    name: Create Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Not changesets/action: in pre mode it filters out every changeset already
      # listed in pre.json, so exiting beta with no new changesets looks like
      # "no changesets found" and it skips versioning entirely. pre enter/exit
      # also has to happen inside version-selective.sh, same process as
      # `changeset version`, or pre.json is read before the edit lands.
      - name: Version Packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/version-selective.sh "${{ inputs.package }}" "${{ inputs.pre_mode }}"

      - name: Create Version PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="changeset-release/${{ github.ref_name }}"
          git checkout -B "$BRANCH"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to version."
            exit 0
          fi
          git commit -m "chore(release): version packages"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
          # pr view would also match a closed/merged PR from a past release
          [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ] || \
            gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" \
              --title "chore(release): version packages" \
              --body "Automated by the Create Version Bump PR workflow. Review the CHANGELOG entries, then merge and run Release Packages."
