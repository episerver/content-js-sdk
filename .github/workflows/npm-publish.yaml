name: Release Packages

# Manual trigger only - run from GitHub Actions UI when ready to publish
on:
  workflow_dispatch:

# Prevents multiple release workflows from running simultaneously
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Needed to push tags
      id-token: write       # CRITICAL: Needed for NPM Provenance security signing

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Required to trigger other actions when the bot pushes commits
          fetch-depth: 0
          # Prevent token from persisting in .git/config (security best practice)
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          # The bash script will handle the specific registry routing via .npmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm --filter "./packages/**" build

      # Not changesets/action: it refuses to publish while any changeset is
      # pending, and opens a version PR for all packages instead. `changeset
      # publish` only publishes versions not yet on npm and tags them locally.
      - name: Publish to NPM
        run: bash ./scripts/publish.sh
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push tags and create GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" --tags
          for tag in $(git tag --points-at HEAD); do
            case "$tag" in *-*) pre=--prerelease ;; *) pre= ;; esac
            gh release create "$tag" --title "$tag" --generate-notes $pre || true
          done
